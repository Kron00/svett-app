# xcode-27 is GitHub's hosted preview image with Xcode 27, newer than actionlint's
# list of hosted labels. It is not a self-hosted runner.
self-hosted-runner:
  labels:
    - xcode-27
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint 1.7.12 predates the concurrency queue key that GitHub documents.
      - 'unexpected key "queue" for "concurrency" section'
